name: Install and test

on:
  pull_request: {}

jobs:
  format:
    name: Check Habitat VLN formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.1.1
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5.0.0
        with:
          python-version: "3.9"
      - name: Install formatters
        run: |
          python -m pip install --upgrade pip
          python -m pip install black==23.1.0 "isort[pyproject]==5.11.5"
      - name: Check changed Python files
        run: |
          mapfile -t files < <(
            git diff --name-only --diff-filter=ACMR \
              "${{ github.event.pull_request.base.sha }}" \
              "${{ github.event.pull_request.head.sha }}" -- \
              ':(glob)habitat_vln/**/*.py' \
              ':(glob)test/test_habitat_vln_*.py'
          )
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No Habitat VLN Python files changed."
            exit 0
          fi
          python -m black --check --diff "${files[@]}"
          python -m isort --check-only --diff "${files[@]}"

  tests:
    name: Run Habitat VLN unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.1.1
      - name: Set up Python
        uses: actions/setup-python@v5.0.0
        with:
          python-version: "3.9"
      - name: Install lightweight test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install numpy opencv-python-headless Pillow PyYAML
      - name: Run Habitat VLN unit tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m unittest discover -s test -p 'test_habitat_vln_*.py'
