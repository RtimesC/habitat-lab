  instruction: Find the elevator area and verify the route using visible evidence.
  mock_policy: true
  qwen_role: controller
  frequency_mode: joint
  joint_hz: 1.0
  no_rate_limit: true
  num_episodes: 1
  max_steps: 20
  width: 64
  height: 64
  hfov: 90
  video_fps: 2.0
  output_dir: habitat_vln/outputs/semantic_indoor/mock_smoke
