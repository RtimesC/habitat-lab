schema_version: 1
name: qwen_advisor_hm3d
description: Layered HM3D engineering run with Qwen as a slower advisor.
arguments:
  task_config: benchmark/nav/pointnav/pointnav_hm3d.yaml
  dataset_path: data/datasets/pointnav/hm3d_smoke/v1/{split}/{split}.json.gz
  dataset_split: val
  instruction: Navigate to the target location and stop when you reach it.
  model_id: Qwen/Qwen2.5-VL-3B-Instruct
  qwen_role: advisor
  frequency_mode: layered
  vision_hz: 5.0
  inference_hz: 0.5
  load_in_4bit: true
  num_episodes: 1
  max_steps: 50
  max_new_tokens: 16
  width: 640
  height: 480
  hfov: 90
  output_dir: habitat_vln/outputs/qwen_advisor_hm3d
